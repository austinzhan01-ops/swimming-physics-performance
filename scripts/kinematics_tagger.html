<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paris 2024 Freestyle Kinematics Tagger (96 Finalists)</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel-2: #263449; --border: #334155;
    --text: #f1f5f9; --muted: #94a3b8; --accent: #38bdf8; --gold: #f59e0b;
    --green: #22c55e; --red: #ef4444; --orange: #f97316;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center;
    justify-content: space-between; gap: 12px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; color: var(--accent); }
  .stats-bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .pill {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 12px; font-weight: 600;
  }
  .pill.gold { border-color: var(--gold); color: var(--gold); }
  .pill.green { border-color: var(--green); color: var(--green); }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: #0284c7; border-color: #0284c7; color: #fff; }
  .btn.primary:hover { background: #0369a1; }
  .btn.success { background: #16a34a; border-color: #16a34a; color: #fff; }
  .btn.success:hover { background: #15803d; }
  .btn.warn { background: #b45309; border-color: #b45309; color: #fff; }
  .btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

  .layout {
    display: grid; grid-template-columns: 350px 1fr; height: calc(100vh - 60px);
  }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; height: auto; } }

  .sidebar {
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .filters {
    padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px;
  }
  .filters select, .filters input[type="text"] {
    width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--gold); font-weight: 600; }
  .roster { overflow-y: auto; flex: 1; }
  .swimmer-item {
    padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .swimmer-item:hover { background: var(--panel-2); }
  .swimmer-item.selected { background: #0c4a6e; border-left: 4px solid var(--accent); }
  .swimmer-item .name { font-weight: 600; font-size: 13px; }
  .swimmer-item .meta { font-size: 11.5px; color: var(--muted); }
  .badge {
    font-size: 10.5px; padding: 2px 6px; border-radius: 4px; font-weight: 700; white-space: nowrap;
  }
  .badge.matched { background: rgba(245, 158, 11, 0.18); color: var(--gold); border: 1px solid var(--gold); }
  .badge.done { background: rgba(34, 197, 94, 0.2); color: var(--green); border: 1px solid var(--green); }
  .badge.warn { background: rgba(239, 68, 68, 0.2); color: var(--red); border: 1px solid var(--red); }

  .main { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
  }
  .card h2 { margin: 0 0 10px 0; font-size: 15px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
  .info-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 10px;
  }
  .kv { background: var(--bg); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); }
  .kv .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .kv .v { font-size: 14.5px; font-weight: 700; margin-top: 2px; }

  .mode-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  video { width: 100%; max-height: 360px; background: #000; border-radius: 8px; border: 1px solid var(--border); }
  .video-controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px;
  }
  .form-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; align-items: end;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  input[type="number"], input[type="text"].field {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; font-weight: 600;
  }
  .kbd {
    display: inline-block; padding: 1px 6px; font-size: 11px; font-family: monospace;
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--accent);
  }
  .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .check-box {
    padding: 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border);
  }
  .check-box.ok { border-color: var(--green); }
  .check-box.flag { border-color: var(--red); background: rgba(239, 68, 68, 0.12); }
  .check-box .val { font-size: 17px; font-weight: 800; }
  .check-box .msg { font-size: 11.5px; margin-top: 3px; color: var(--muted); }
  .check-box.flag .msg { color: #fca5a5; font-weight: 600; }
  .check-box.ok .msg { color: #86efac; }
  .shortcut-bar {
    font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 12px;
    padding-top: 8px; border-top: 1px solid var(--border); margin-top: 10px;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Paris 2024 Freestyle Kinematics Tagger</h1>
  <div class="stats-bar">
    <span class="pill green" id="statLogged">Logged: 0 / 96</span>
    <span class="pill gold" id="statMatched">Tier 2 Matched: 0 / 31</span>
    <label class="btn" style="margin:0;">
      Import CSV <input type="file" id="csvFileInput" accept=".csv" style="display:none;" />
    </label>
    <button class="btn success" id="btnExport">Export paris2024_kinematics.csv</button>
    <button class="btn" id="btnResetStorage" title="Clear browser autosave">Reset Autosave</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="filters">
      <select id="eventFilter">
        <option value="ALL">All 12 Finals (96 Finalists)</option>
      </select>
      <input type="text" id="searchFilter" placeholder="Search swimmer or NOC..." />
      <label class="toggle-row">
        <input type="checkbox" id="matchedOnlyToggle" />
        Priority: 31 Matched Returning Olympians Only
      </label>
      <label class="toggle-row" style="color: var(--muted);">
        <input type="checkbox" id="unloggedOnlyToggle" />
        Show unlogged only
      </label>
    </div>
    <div class="roster" id="rosterList"></div>
  </aside>

  <main class="main">
    <!-- Swimmer Header Card -->
    <section class="card" id="swimmerCard">
      <h2>
        <span id="swTitle">Select a swimmer</span>
        <span id="swBadges"></span>
      </h2>
      <div class="info-grid" id="swInfoGrid"></div>
      <div style="margin-top:10px; font-size:12.5px; color:var(--muted);" id="swVideoInfo"></div>
    </section>

    <!-- Dual-Mode Measurement Card -->
    <section class="card">
      <div class="mode-tabs">
        <button class="btn active" id="tabModeA">Mode A: Local Video File (Frame-Step)</button>
        <button class="btn" id="tabModeB">Mode B: YouTube / Stopwatch Timestamp Mode</button>
      </div>

      <!-- Mode A: Local Video -->
      <div id="modeAPanel">
        <div class="video-controls" style="margin-top:0; margin-bottom:8px;">
          <label class="btn primary" style="margin:0;">
            Load Local Race Video (MP4/WebM)
            <input type="file" id="videoFileInput" accept="video/*" style="display:none;" />
          </label>
          <span>FPS:</span>
          <select id="fpsSelect" style="padding:4px 6px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px;">
            <option value="30" selected>30 fps</option>
            <option value="25">25 fps</option>
            <option value="50">50 fps</option>
            <option value="60">60 fps</option>
          </select>
          <span>Speed:</span>
          <select id="speedSelect" style="padding:4px 6px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px;">
            <option value="0.25">0.25x</option>
            <option value="0.5" selected>0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1.0">1.0x</option>
          </select>
          <span class="pill" id="vidTimeDisplay">t = 0.000 s</span>
        </div>
        <video id="videoPlayer" controls></video>
        <div class="video-controls">
          <button class="btn" id="btnStepBack">−1 Frame (<span class="kbd">,</span>)</button>
          <button class="btn" id="btnPlayPause">Play/Pause (<span class="kbd">P</span>)</button>
          <button class="btn" id="btnStepFwd">+1 Frame (<span class="kbd">.</span>)</button>
          <button class="btn primary" id="btnStampStart">Stamp 15m Start (<span class="kbd">1</span>)</button>
          <button class="btn primary" id="btnStampEnd">Stamp 45m End (<span class="kbd">2</span>)</button>
          <button class="btn warn" id="btnAddCycle">+1 Cycle (<span class="kbd">Space</span>/<span class="kbd">S</span>)</button>
          <button class="btn warn" id="btnAddHalfCycle">+0.5 Cycle (<span class="kbd">H</span>)</button>
          <button class="btn" id="btnSubHalfCycle">−0.5</button>
          <button class="btn" id="btnResetCycles">Reset Cycles</button>
        </div>
      </div>

      <!-- Mode B: YouTube / Stopwatch -->
      <div id="modeBPanel" style="display:none;">
        <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px;">
          <button class="btn primary" id="btnSwStart">Start Stopwatch (<span class="kbd">1</span>)</button>
          <button class="btn primary" id="btnSwStop">Stop Stopwatch (<span class="kbd">2</span>)</button>
          <button class="btn" id="btnSwReset">Reset</button>
          <span class="pill" id="swDisplay" style="font-size:15px;">0.00 s</span>
          <button class="btn warn" id="btnAddCycleB">+1 Cycle (<span class="kbd">Space</span>/<span class="kbd">S</span>)</button>
          <button class="btn warn" id="btnAddHalfCycleB">+0.5 Cycle (<span class="kbd">H</span>)</button>
          <button class="btn" id="btnResetCyclesB">Reset Cycles</button>
        </div>
        <div class="form-grid" style="margin-bottom:10px;">
          <div>
            <label>Start Timestamp (SS.ss or MM:SS.ss)</label>
            <input type="text" class="field" id="inpStartTs" placeholder="e.g. 0:12.40 or 12.40" />
          </div>
          <div>
            <label>End Timestamp (SS.ss or MM:SS.ss)</label>
            <input type="text" class="field" id="inpEndTs" placeholder="e.g. 0:26.15 or 26.15" />
          </div>
          <div>
            <button class="btn" id="btnComputeTs" style="width:100%;">Compute Segment Time</button>
          </div>
        </div>
      </div>

      <!-- Shared Measurement Fields -->
      <div class="form-grid" style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
        <div>
          <label>segment_distance_m
            <button class="btn" style="padding:1px 6px; font-size:11px; margin-left:4px;" id="btnDist30">30m</button>
            <button class="btn" style="padding:1px 6px; font-size:11px;" id="btnDist20">20m</button>
          </label>
          <input type="number" step="0.5" id="inpSegDist" value="30.0" />
        </div>
        <div>
          <label>segment_time_sec</label>
          <input type="number" step="0.01" id="inpSegTime" placeholder="e.g. 14.25" />
        </div>
        <div>
          <label>stroke_cycles (1 cycle = 2 arm pulls)</label>
          <input type="number" step="0.5" id="inpCycles" placeholder="e.g. 13.5" />
        </div>
        <div>
          <label>source_notes</label>
          <input type="text" class="field" id="inpNotes" placeholder="e.g. Lap 2 65-95m, Olympics.com" />
        </div>
      </div>

      <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
        <button class="btn success" id="btnSaveNext">Save & Next Swimmer (<span class="kbd">Enter</span>)</button>
        <button class="btn primary" id="btnSaveOnly">Save Swimmer</button>
        <button class="btn" id="btnClearRow">Clear Measurements</button>
      </div>

      <div class="shortcut-bar">
        <span><span class="kbd">,</span> / <span class="kbd">.</span> Frame step</span>
        <span><span class="kbd">Shift+,</span> / <span class="kbd">Shift+.</span> ±5 frames</span>
        <span><span class="kbd">1</span> Stamp Start</span>
        <span><span class="kbd">2</span> Stamp End</span>
        <span><span class="kbd">Space</span> / <span class="kbd">S</span> +1 Cycle</span>
        <span><span class="kbd">H</span> +0.5 Cycle</span>
        <span><span class="kbd">P</span> Play/Pause</span>
      </div>
    </section>

    <!-- Live Instant Sanity Checks -->
    <section class="card">
      <h2>Live Hydrodynamic & Biomechanical Sanity Checks</h2>
      <div class="checks" id="sanityChecks"></div>
    </section>
  </main>
</div>

const EXPORT_COLS = ["sex", "event", "distance_m", "event_category", "rank", "participant_code", "athlete_key", "athlete_name", "noc", "final_time_sec", "whole_race_velocity_ms", "height_m", "mass_kg", "bmi", "whole_race_froude", "wa_points", "segment_distance_m", "segment_time_sec", "stroke_cycles", "source_notes"];
const STORAGE_KEY = "paris2024_kinematics_tagger_v1";

let rows = [];
let selectedIdx = 0;
let mode = "A";
let stampStartSec = null;
let swStartPerf = null;
let swInterval = null;

function initData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length === DEFAULT_ROWS.length) {
        rows = parsed;
        return;
      }
    } catch (e) {}
  }
  rows = DEFAULT_ROWS.map(r => ({ ...r }));
}

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
}

function isLogged(r) {
  return Number(r.segment_distance_m) > 0 && Number(r.segment_time_sec) > 0 && Number(r.stroke_cycles) > 0;
}

function isMatched(r) {
  return r.height_m !== null && r.height_m !== "" && !isNaN(Number(r.height_m)) &&
         r.mass_kg !== null && r.mass_kg !== "" && !isNaN(Number(r.mass_kg));
}

function computeMetrics(r, segDist, segTime, cycles) {
  const d = Number(segDist), t = Number(segTime), c = Number(cycles);
  if (!(d > 0 && t > 0 && c > 0)) return null;
  const cleanV = d / t;
  const wholeV = Number(r.whole_race_velocity_ms);
  const inflation = wholeV - cleanV;
  const sr = c / t;
  const sl = cleanV / sr;
  const si = cleanV * sl;
  const h = isMatched(r) ? Number(r.height_m) : null;
  const cleanFr = h ? cleanV / Math.sqrt(9.81 * h) : null;
  const wholeFr = h ? wholeV / Math.sqrt(9.81 * h) : null;

  const flags = {
    v: (cleanV < 1.3 || cleanV > 2.4) || (r.event_category === "Sprint" && (cleanV - wholeV) > 0.05),
    sl: (sl < 1.5 || sl > 2.9),
    sr: (sr < 0.50 || sr > 1.15),
  };
  return { cleanV, inflation, sr, sl, si, cleanFr, wholeFr, flags, anyFlag: flags.v || flags.sl || flags.sr };
}

function parseTimestamp(str) {
  if (!str) return NaN;
  const s = String(str).trim();
  if (!s) return NaN;
  const parts = s.split(":");
  if (parts.length === 1) return Number(parts[0]);
  if (parts.length === 2) return Number(parts[0]) * 60 + Number(parts[1]);
  if (parts.length === 3) return Number(parts[0]) * 3600 + Number(parts[1]) * 60 + Number(parts[2]);
  return NaN;
}

function populateEventFilter() {
  const sel = document.getElementById("eventFilter");
  const seen = new Set();
  rows.forEach(r => {
    const key = `${r.sex} | ${r.event}`;
    if (!seen.has(key)) {
      seen.add(key);
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = key;
      sel.appendChild(opt);
    }
  });
}

function getFilteredIndices() {
  const evFilter = document.getElementById("eventFilter").value;
  const q = document.getElementById("searchFilter").value.trim().toLowerCase();
  const matchedOnly = document.getElementById("matchedOnlyToggle").checked;
  const unloggedOnly = document.getElementById("unloggedOnlyToggle").checked;
  const idxs = [];
  rows.forEach((r, i) => {
    if (evFilter !== "ALL" && `${r.sex} | ${r.event}` !== evFilter) return;
    if (matchedOnly && !isMatched(r)) return;
    if (unloggedOnly && isLogged(r)) return;
    if (q && !`${r.athlete_name} ${r.noc} ${r.event}`.toLowerCase().includes(q)) return;
    idxs.push(i);
  });
  return idxs;
}

function renderRoster() {
  const list = document.getElementById("rosterList");
  list.innerHTML = "";
  const idxs = getFilteredIndices();

  let nLogged = 0, nMatchedLogged = 0;
  rows.forEach(r => {
    if (isLogged(r)) {
      nLogged++;
      if (isMatched(r)) nMatchedLogged++;
    }
  });
  document.getElementById("statLogged").textContent = `Logged: ${nLogged} / ${rows.length}`;
  document.getElementById("statMatched").textContent = `Tier 2 Matched: ${nMatchedLogged} / 31`;

  idxs.forEach(i => {
    const r = rows[i];
    const div = document.createElement("div");
    div.className = "swimmer-item" + (i === selectedIdx ? " selected" : "");
    const m = isLogged(r) ? computeMetrics(r, r.segment_distance_m, r.segment_time_sec, r.stroke_cycles) : null;
    let badges = "";
    if (isMatched(r)) badges += `<span class="badge matched">T2</span> `;
    if (m) {
      badges += m.anyFlag
        ? `<span class="badge warn">FLAG</span>`
        : `<span class="badge done">OK</span>`;
    }
    div.innerHTML = `
      <div>
        <div class="name">#${r.rank} ${r.athlete_name} (${r.noc})</div>
        <div class="meta">${r.sex} ${r.event.replace(" Freestyle","")} · Lane ${r.lane ?? "?"} · ${r.final_time_sec}s</div>
      </div>
      <div>${badges}</div>
    `;
    div.onclick = () => selectSwimmer(i);
    list.appendChild(div);
  });
}

function selectSwimmer(idx) {
  selectedIdx = idx;
  stampStartSec = null;
  const r = rows[idx];
  document.getElementById("swTitle").textContent = `${r.athlete_name} (${r.noc}) — ${r.sex} ${r.event}`;
  document.getElementById("swBadges").innerHTML =
    (isMatched(r) ? `<span class="badge matched">Matched Returning Olympian (Tier 2)</span> ` : "") +
    `<span class="badge" style="background:#334155;">Lane ${r.lane ?? "?"} · Rank #${r.rank}</span>`;

  const info = [
    ["Final Time", `${r.final_time_sec} s`],
    ["Whole-Race Speed", `${Number(r.whole_race_velocity_ms).toFixed(3)} m/s`],
    ["Reaction Time", r.reaction_time_sec ? `${r.reaction_time_sec} s` : "—"],
    ["Target Lap 50m", r.target_lap_50m_sec ? `Lap ${r.target_lap_number}: ${r.target_lap_50m_sec}s (${Number(r.target_lap_velocity_ms).toFixed(3)} m/s)` : "—"],
    ["Height / Mass", isMatched(r) ? `${r.height_m} m / ${r.mass_kg} kg` : "Unmatched (NaN)"],
    ["Whole-Race Fr", isMatched(r) ? Number(r.whole_race_froude).toFixed(3) : "—"],
  ];
  document.getElementById("swInfoGrid").innerHTML = info.map(([k, v]) =>
    `<div class="kv"><div class="k">${k}</div><div class="v">${v}</div></div>`
  ).join("");

  document.getElementById("swVideoInfo").innerHTML =
    `<strong>Recommended Window:</strong> ${r.recommended_lap_to_measure || "15m -> 45m"} (${r.measurement_window_m || 30.0} m) · ` +
    `<strong>Final Date:</strong> ${r.final_date || ""} · ` +
    (r.video_url ? `<a href="${r.video_url}" target="_blank" rel="noopener">Open Official Olympics.com Replay ↗</a>` : "");

  document.getElementById("inpSegDist").value = r.segment_distance_m ?? (r.measurement_window_m || 30.0);
  document.getElementById("inpSegTime").value = r.segment_time_sec ?? "";
  document.getElementById("inpCycles").value = r.stroke_cycles ?? "";
  document.getElementById("inpNotes").value = r.source_notes ?? "";
  document.getElementById("inpStartTs").value = "";
  document.getElementById("inpEndTs").value = "";

  renderRoster();
  renderSanityChecks();
}

function renderSanityChecks() {
  const r = rows[selectedIdx];
  const segDist = document.getElementById("inpSegDist").value;
  const segTime = document.getElementById("inpSegTime").value;
  const cycles = document.getElementById("inpCycles").value;
  const m = computeMetrics(r, segDist, segTime, cycles);
  const el = document.getElementById("sanityChecks");
  if (!m) {
    el.innerHTML = `<div class="check-box"><div class="msg">Enter segment_distance_m, segment_time_sec, and stroke_cycles to see live checks.</div></div>`;
    return;
  }

  const vMsg = m.flags.v
    ? (m.cleanV < 1.3 || m.cleanV > 2.4
        ? "OUT OF RANGE [1.3–2.4 m/s]!"
        : `Faster than whole-race (${Number(r.whole_race_velocity_ms).toFixed(3)}) by >0.05 m/s in Sprint!`)
    : `OK (Inflation: ${m.inflation >= 0 ? "+" : ""}${m.inflation.toFixed(3)} m/s)`;

  const slMsg = m.flags.sl
    ? "OUT OF RANGE [1.5–2.9 m/cycle]! Check if single arm pulls were counted instead of 2-arm cycles."
    : "OK (within 1.5–2.9 m/cycle)";

  const srMsg = m.flags.sr
    ? "OUT OF RANGE [0.50–1.15 Hz / 30–69 cpm]!"
    : `OK (${(m.sr * 60).toFixed(1)} cycles/min)`;

  let frHtml = "";
  if (m.cleanFr !== null) {
    const regime = m.cleanFr > 0.42 ? "> 0.42 (Supercritical)" : "≤ 0.42 (Sub-hull)";
    frHtml = `
      <div class="check-box ok">
        <div class="k" style="font-size:11px;color:var(--muted);">CLEAN FROUDE (Fr)</div>
        <div class="val">${m.cleanFr.toFixed(3)}</div>
        <div class="msg">${regime} · Whole Fr = ${m.wholeFr.toFixed(3)}</div>
      </div>`;
  }

  el.innerHTML = `
    <div class="check-box ${m.flags.v ? "flag" : "ok"}">
      <div class="k" style="font-size:11px;color:var(--muted);">CLEAN VELOCITY</div>
      <div class="val">${m.cleanV.toFixed(3)} m/s</div>
      <div class="msg">${vMsg}</div>
    </div>
    <div class="check-box ${m.flags.sl ? "flag" : "ok"}">
      <div class="k" style="font-size:11px;color:var(--muted);">STROKE LENGTH (SL)</div>
      <div class="val">${m.sl.toFixed(2)} m/cyc</div>
      <div class="msg">${slMsg}</div>
    </div>
    <div class="check-box ${m.flags.sr ? "flag" : "ok"}">
      <div class="k" style="font-size:11px;color:var(--muted);">STROKE RATE (SR)</div>
      <div class="val">${m.sr.toFixed(3)} Hz</div>
      <div class="msg">${srMsg}</div>
    </div>
    <div class="check-box ok">
      <div class="k" style="font-size:11px;color:var(--muted);">STROKE INDEX (SI)</div>
      <div class="val">${m.si.toFixed(2)} m²/s</div>
      <div class="msg">Efficiency proxy (v × SL)</div>
    </div>
    ${frHtml}
  `;
}

function saveCurrent(advance = false) {
  const r = rows[selectedIdx];
  const d = document.getElementById("inpSegDist").value;
  const t = document.getElementById("inpSegTime").value;
  const c = document.getElementById("inpCycles").value;
  const n = document.getElementById("inpNotes").value.trim();

  r.segment_distance_m = d !== "" ? Number(d) : null;
  r.segment_time_sec = t !== "" ? Number(Number(t).toFixed(3)) : null;
  r.stroke_cycles = c !== "" ? Number(c) : null;
  r.source_notes = n;
  persist();
  renderRoster();
  renderSanityChecks();

  if (advance) {
    const idxs = getFilteredIndices();
    const pos = idxs.indexOf(selectedIdx);
    if (pos !== -1 && pos + 1 < idxs.length) {
      selectSwimmer(idxs[pos + 1]);
    }
  }
}

function addCycles(delta) {
  const inp = document.getElementById("inpCycles");
  const cur = Number(inp.value) || 0;
  inp.value = Math.max(0, +(cur + delta).toFixed(1));
  renderSanityChecks();
}

// CSV Export (exact 20-column schema of paris2024_kinematics_template.csv)
function csvEscape(v) {
  if (v === null || v === undefined) return "";
  const s = String(v);
  if (s.includes(",") || s.includes('"') || s.includes("\n")) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function exportCSV() {
  const lines = [EXPORT_COLS.join(",")];
  rows.forEach(r => {
    lines.push(EXPORT_COLS.map(c => csvEscape(r[c])).join(","));
  });
  const blob = new Blob([lines.join("\n") + "\n"], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "paris2024_kinematics.csv";
  a.click();
  URL.revokeObjectURL(url);
}

// RFC-4180 CSV parser for importing existing paris2024_kinematics.csv
function parseCSVText(text) {
  const out = [];
  let row = [], val = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (inQuotes) {
      if (ch === '"' && next === '"') { val += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else val += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(val); val = ""; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && next === '\n') i++;
        row.push(val); val = "";
        if (row.some(x => x !== "")) out.push(row);
        row = [];
      } else val += ch;
    }
  }
  if (val !== "" || row.length > 0) { row.push(val); out.push(row); }
  return out;
}

function importCSV(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const grid = parseCSVText(e.target.result);
    if (grid.length < 2) return;
    const hdr = grid[0].map(h => h.trim());
    const idxMap = Object.fromEntries(hdr.map((h, i) => [h, i]));
    let updated = 0;
    for (let i = 1; i < grid.length; i++) {
      const g = grid[i];
      const pcode = g[idxMap["participant_code"]];
      const evt = g[idxMap["event"]];
      const sex = g[idxMap["sex"]];
      const target = rows.find(r => String(r.participant_code) === String(pcode) && r.event === evt && r.sex === sex);
      if (target) {
        for (const col of ["segment_distance_m", "segment_time_sec", "stroke_cycles", "source_notes"]) {
          if (idxMap[col] !== undefined) {
            const raw = g[idxMap[col]];
            if (col === "source_notes") target[col] = raw ?? "";
            else target[col] = (raw !== undefined && raw !== "") ? Number(raw) : null;
          }
        }
        updated++;
      }
    }
    persist();
    selectSwimmer(selectedIdx);
    alert(`Imported measurements for ${updated} rows from ${file.name}.`);
  };
  reader.readAsText(file);
}

// Video & Stopwatch controls
const vid = document.getElementById("videoPlayer");
vid.addEventListener("timeupdate", () => {
  document.getElementById("vidTimeDisplay").textContent = `t = ${vid.currentTime.toFixed(3)} s`;
});

function stepFrame(n) {
  if (!vid.src) return;
  vid.pause();
  const fps = Number(document.getElementById("fpsSelect").value) || 30;
  vid.currentTime = Math.max(0, vid.currentTime + n / fps);
  document.getElementById("vidTimeDisplay").textContent = `t = ${vid.currentTime.toFixed(3)} s`;
}

function stampStart() {
  if (mode === "A") {
    stampStartSec = vid.currentTime;
    document.getElementById("inpStartTs").value = stampStartSec.toFixed(3);
  } else {
    swStartPerf = performance.now();
    clearInterval(swInterval);
    swInterval = setInterval(() => {
      const dt = (performance.now() - swStartPerf) / 1000;
      document.getElementById("swDisplay").textContent = `${dt.toFixed(2)} s`;
    }, 30);
  }
}

function stampEnd() {
  if (mode === "A") {
    if (stampStartSec === null) { alert("Press 1 to stamp Start Time first."); return; }
    const dt = vid.currentTime - stampStartSec;
    if (dt <= 0) { alert("End time must be after Start time."); return; }
    document.getElementById("inpEndTs").value = vid.currentTime.toFixed(3);
    document.getElementById("inpSegTime").value = dt.toFixed(2);
    renderSanityChecks();
  } else {
    if (swStartPerf === null) return;
    clearInterval(swInterval);
    const dt = (performance.now() - swStartPerf) / 1000;
    swStartPerf = null;
    document.getElementById("swDisplay").textContent = `${dt.toFixed(2)} s`;
    document.getElementById("inpSegTime").value = dt.toFixed(2);
    renderSanityChecks();
  }
}

// Wire UI Events
document.getElementById("eventFilter").onchange = renderRoster;
document.getElementById("searchFilter").oninput = renderRoster;
document.getElementById("matchedOnlyToggle").onchange = renderRoster;
document.getElementById("unloggedOnlyToggle").onchange = renderRoster;
document.getElementById("btnExport").onclick = exportCSV;
document.getElementById("csvFileInput").onchange = e => { if (e.target.files[0]) importCSV(e.target.files[0]); };
document.getElementById("btnResetStorage").onclick = () => {
  if (confirm("Clear browser autosave and reload clean 96-finalist template?")) {
    localStorage.removeItem(STORAGE_KEY);
    initData();
    selectSwimmer(0);
  }
};

document.getElementById("tabModeA").onclick = () => {
  mode = "A";
  document.getElementById("tabModeA").classList.add("active");
  document.getElementById("tabModeB").classList.remove("active");
  document.getElementById("modeAPanel").style.display = "block";
  document.getElementById("modeBPanel").style.display = "none";
};
document.getElementById("tabModeB").onclick = () => {
  mode = "B";
  document.getElementById("tabModeB").classList.add("active");
  document.getElementById("tabModeA").classList.remove("active");
  document.getElementById("modeAPanel").style.display = "none";
  document.getElementById("modeBPanel").style.display = "block";
};

document.getElementById("videoFileInput").onchange = e => {
  const f = e.target.files[0];
  if (f) {
    vid.src = URL.createObjectURL(f);
    vid.playbackRate = Number(document.getElementById("speedSelect").value);
  }
};
document.getElementById("speedSelect").onchange = e => { vid.playbackRate = Number(e.target.value); };
document.getElementById("btnStepBack").onclick = () => stepFrame(-1);
document.getElementById("btnStepFwd").onclick = () => stepFrame(1);
document.getElementById("btnPlayPause").onclick = () => { if (vid.paused) vid.play(); else vid.pause(); };
document.getElementById("btnStampStart").onclick = stampStart;
document.getElementById("btnStampEnd").onclick = stampEnd;
document.getElementById("btnAddCycle").onclick = () => addCycles(1);
document.getElementById("btnAddHalfCycle").onclick = () => addCycles(0.5);
document.getElementById("btnSubHalfCycle").onclick = () => addCycles(-0.5);
document.getElementById("btnResetCycles").onclick = () => { document.getElementById("inpCycles").value = ""; renderSanityChecks(); };

document.getElementById("btnSwStart").onclick = stampStart;
document.getElementById("btnSwStop").onclick = stampEnd;
document.getElementById("btnSwReset").onclick = () => {
  clearInterval(swInterval); swStartPerf = null;
  document.getElementById("swDisplay").textContent = "0.00 s";
};
document.getElementById("btnAddCycleB").onclick = () => addCycles(1);
document.getElementById("btnAddHalfCycleB").onclick = () => addCycles(0.5);
document.getElementById("btnResetCyclesB").onclick = () => { document.getElementById("inpCycles").value = ""; renderSanityChecks(); };

document.getElementById("btnComputeTs").onclick = () => {
  const t1 = parseTimestamp(document.getElementById("inpStartTs").value);
  const t2 = parseTimestamp(document.getElementById("inpEndTs").value);
  if (isNaN(t1) || isNaN(t2) || t2 <= t1) { alert("Enter valid Start and End timestamps (End > Start)."); return; }
  document.getElementById("inpSegTime").value = (t2 - t1).toFixed(2);
  renderSanityChecks();
};

document.getElementById("btnDist30").onclick = () => { document.getElementById("inpSegDist").value = "30.0"; renderSanityChecks(); };
document.getElementById("btnDist20").onclick = () => { document.getElementById("inpSegDist").value = "20.0"; renderSanityChecks(); };
["inpSegDist", "inpSegTime", "inpCycles"].forEach(id => {
  document.getElementById(id).addEventListener("input", renderSanityChecks);
});

document.getElementById("btnSaveNext").onclick = () => saveCurrent(true);
document.getElementById("btnSaveOnly").onclick = () => saveCurrent(false);
document.getElementById("btnClearRow").onclick = () => {
  document.getElementById("inpSegTime").value = "";
  document.getElementById("inpCycles").value = "";
  document.getElementById("inpNotes").value = "";
  saveCurrent(false);
};

// Global keyboard shortcuts (disabled when typing in inputs)
document.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") {
    if (e.key === "Enter" && tag === "INPUT") { e.preventDefault(); saveCurrent(true); }
    return;
  }
  if (e.key === ",") { e.preventDefault(); stepFrame(e.shiftKey ? -5 : -1); }
  else if (e.key === ".") { e.preventDefault(); stepFrame(e.shiftKey ? 5 : 1); }
  else if (e.key === "1") { e.preventDefault(); stampStart(); }
  else if (e.key === "2") { e.preventDefault(); stampEnd(); }
  else if (e.key === " " || e.key.toLowerCase() === "s") { e.preventDefault(); addCycles(1); }
  else if (e.key.toLowerCase() === "h") { e.preventDefault(); addCycles(0.5); }
  else if (e.key.toLowerCase() === "p" || e.key.toLowerCase() === "k") { e.preventDefault(); if (vid.src) { if (vid.paused) vid.play(); else vid.pause(); } }
  else if (e.key === "Enter") { e.preventDefault(); saveCurrent(true); }
});

initData();
populateEventFilter();
selectSwimmer(0);
</script>
